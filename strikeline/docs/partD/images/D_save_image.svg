<text x="20" y="150" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="15" fill="#29a8e0" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">clk</text>
