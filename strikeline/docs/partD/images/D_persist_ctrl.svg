<path d="M 20 450 L 300 450" fill="none" stroke="#0d4fa1" stroke-width="2.5"/>
<polygon points="300,450 290,454 290,446" fill="#0d4fa1"/>
<text x="20" y="442" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="12" fill="#0d4fa1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">c_defaults (game_fsm | flash_ctrl)</text>
<text x="20" y="520" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="12" fill="#e07b00" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">from C turn_fsm (orange),</text>
<text x="20" y="538" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="12" fill="#b0279c" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">game_fsm (purple), flash (blue)</text>
