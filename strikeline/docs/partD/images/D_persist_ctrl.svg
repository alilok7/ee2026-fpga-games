<polygon points="980,350 990,346 990,354" fill="#2e8b3d"/>
<text x="1215" y="342" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#2e8b3d" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">rd [7:0]  &lt;- save_image rd1</text>
