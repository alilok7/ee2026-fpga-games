<polygon points="1450,420 1440,424 1440,416" fill="#a0461e"/>
<text x="1215" y="410" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">busy -&gt; C turn_fsm, game_fsm, flash_ctrl</text>
<text x="1010" y="470" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#d32f2f" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">busy = pending OR running OR any command</text>
<text x="1010" y="486" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#d32f2f" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">  arriving this clock (so flash_ctrl never</text>
<text x="1010" y="502" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#d32f2f" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">  copies a half-updated image)</text>
