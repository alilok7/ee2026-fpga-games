<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<rect x="0" y="0" width="1500" height="700" fill="white"/>
<text x="750" y="46" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="34" fill="#2e8b3d" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">BLOCK DIAGRAM: spi_byte  (one byte, SPI mode 0)</text>
<rect x="170" y="90" width="1100" height="560" fill="none" stroke="#222222" stroke-width="6"/>
<text x="174" y="80" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="20" fill="#222222" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">module spi_byte</text>
<text x="20" y="160" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="15" fill="#29a8e0" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">clk 100 MHz</text>
<path d="M 20 170 L 250 170" fill="none" stroke="#29a8e0" stroke-width="2.5"/>
<polygon points="250,170 240,174 240,166" fill="#29a8e0"/>
<path d="M 20 260 L 250 260" fill="none" stroke="#222222" stroke-width="2.5"/>
<polygon points="250,260 240,264 240,256" fill="#222222"/>
<text x="90" y="252" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">start</text>
<path d="M 20 440 L 560 440" fill="none" stroke="#0d4fa1" stroke-width="2.5"/>
<polygon points="560,440 550,444 550,436" fill="#0d4fa1"/>
<text x="90" y="432" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#0d4fa1" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">tx</text>
<line x1="124" y1="448" x2="136" y2="432" stroke="#0d4fa1" stroke-width="2.5"/>
<text x="134" y="429" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#0d4fa1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">8</text>
<path d="M 20 560 L 560 560" fill="none" stroke="#0d4fa1" stroke-width="2.5"/>
<polygon points="560,560 550,564 550,556" fill="#0d4fa1"/>
<text x="90" y="552" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#0d4fa1" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">miso</text>
<rect x="250" y="140" width="260" height="170" rx="4" fill="white" stroke="#b0279c" stroke-width="3"/>
<text x="252" y="133" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="16" fill="#b0279c" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">FSM</text>
<text x="260" y="162" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#b0279c" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// IDLE --start--&gt; SHIFT</text>
<text x="260" y="179" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#b0279c" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// SHIFT --last_clk--&gt; IDLE</text>
<text x="260" y="196" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#b0279c" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// state reg + always @(*)</text>
<text x="260" y="213" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#b0279c" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">//   next-state + assign busy</text>
<rect x="250" y="360" width="260" height="130" rx="4" fill="white" stroke="#29a8e0" stroke-width="3"/>
<text x="252" y="353" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="16" fill="#29a8e0" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">phase counter</text>
<text x="260" y="382" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#29a8e0" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// mod-8 counter:</text>
<text x="260" y="399" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#29a8e0" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// 8 clocks per bit</text>
<text x="260" y="416" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#29a8e0" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// SCK = 100 MHz / 8</text>
<rect x="560" y="360" width="260" height="130" rx="4" fill="white" stroke="#29a8e0" stroke-width="3"/>
<text x="562" y="353" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="16" fill="#29a8e0" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">bit counter</text>
<text x="570" y="382" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#29a8e0" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// mod-8: which bit</text>
<text x="570" y="399" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#29a8e0" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// last_clk = phase 7</text>
<text x="570" y="416" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#29a8e0" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">//   AND bit 7</text>
<rect x="560" y="520" width="300" height="100" rx="4" fill="white" stroke="#2e8b3d" stroke-width="3"/>
<text x="562" y="513" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="16" fill="#2e8b3d" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">shift register sh</text>
<text x="570" y="542" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#2e8b3d" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// load tx; phase 4: sh &lt;= {sh[6:0], miso}</text>
<path d="M 510 220 L 900 220" fill="none" stroke="#b0279c" stroke-width="2.5"/>
<polygon points="900,220 890,224 890,216" fill="#b0279c"/>
<text x="700" y="212" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#b0279c" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">state</text>
<rect x="900" y="160" width="300" height="200" rx="4" fill="white" stroke="#a0461e" stroke-width="3"/>
<text x="902" y="153" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="16" fill="#a0461e" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">outputs (registered)</text>
<text x="910" y="182" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// phase 0: sck &lt;= 0, mosi &lt;= sh[7]</text>
<text x="910" y="199" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// phase 4: sck &lt;= 1, read miso</text>
<text x="910" y="216" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// phase 7 of bit 7: done &lt;= 1,</text>
<text x="910" y="233" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">//   rx &lt;= sh</text>
<text x="910" y="250" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">// busy = (state == SHIFT)</text>
<path d="M 820 425 L 1050 425 L 1050 360" fill="none" stroke="#29a8e0" stroke-width="2.5"/>
<polygon points="1050,360 1054,370 1046,370" fill="#29a8e0"/>
<text x="940" y="417" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#29a8e0" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">phase, bit_cnt</text>
<path d="M 860 570 L 1100 570 L 1100 360" fill="none" stroke="#2e8b3d" stroke-width="2.5"/>
<polygon points="1100,360 1104,370 1096,370" fill="#2e8b3d"/>
<text x="1000" y="562" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#2e8b3d" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">sh</text>
<path d="M 1200 190 L 1460 190" fill="none" stroke="#a0461e" stroke-width="2.5"/>
<polygon points="1460,190 1450,194 1450,186" fill="#a0461e"/>
<text x="1330" y="182" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">sck</text>
<path d="M 1200 230 L 1460 230" fill="none" stroke="#a0461e" stroke-width="2.5"/>
<polygon points="1460,230 1450,234 1450,226" fill="#a0461e"/>
<text x="1330" y="222" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">mosi</text>
<path d="M 1200 270 L 1460 270" fill="none" stroke="#a0461e" stroke-width="2.5"/>
<polygon points="1460,270 1450,274 1450,266" fill="#a0461e"/>
<text x="1330" y="262" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">done</text>
<path d="M 1200 310 L 1460 310" fill="none" stroke="#a0461e" stroke-width="2.5"/>
<polygon points="1460,310 1450,314 1450,306" fill="#a0461e"/>
<text x="1330" y="302" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">busy</text>
<path d="M 1200 350 L 1460 350" fill="none" stroke="#a0461e" stroke-width="2.5"/>
<polygon points="1460,350 1450,354 1450,346" fill="#a0461e"/>
<text x="1330" y="342" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">rx</text>
<line x1="1394" y1="358" x2="1406" y2="342" stroke="#a0461e" stroke-width="2.5"/>
<text x="1404" y="339" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#a0461e" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">8</text>
<text x="1290" y="440" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#0d4fa1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">sck -&gt; STARTUPE2</text>
<text x="1290" y="456" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#0d4fa1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">  -&gt; flash CCLK</text>
<text x="1290" y="472" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#0d4fa1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">mosi -&gt; QspiDB[0]</text>
<text x="1290" y="488" font-family="Segoe Print, Comic Sans MS, Chalkboard, cursive" font-size="13" fill="#0d4fa1" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4" stroke-linejoin="round">miso &lt;- QspiDB[1]</text>
</svg>
